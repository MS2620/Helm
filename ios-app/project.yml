name: AIHomeAssistant
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Sources/Info.plist

targets:
  AIHomeAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "AI Home"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Verify your identity with Face ID before running sensitive Home Assistant actions such as unlocking doors, opening garage covers, or disarming alarms."
        NSMicrophoneUsageDescription: "Used for hands-free voice commands to your AI and Home Assistant router."
        NSSpeechRecognitionUsageDescription: "Transcribes your spoken voice commands on-device so they can be sent to your AI router."
    sdkDependencies:
      - LocalAuthentication.framework
      - Speech.framework
      - AVFoundation.framework
      - Security.framework
