name: Helm
options:
  bundleIdPrefix: com.ms2620
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Helm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Helm
        EXECUTABLE_NAME: Helm
        PRODUCT_BUNDLE_IDENTIFIER: com.ms2620.Helm
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ALWAYS_SEARCH_USER_PATHS: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    sdkDependencies:
      - LocalAuthentication.framework
      - Speech.framework
      - AVFoundation.framework
      - Security.framework
